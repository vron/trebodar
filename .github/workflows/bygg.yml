# Bygger webbplatsen ur källorna på main och publicerar den med GitHub Pages: startsidan med bilderna, planerna och
# handlingsförteckningen, modellen i 3D (webbvisaren), handlingarna (rapporterna, ritningarna och kameraplanen) och
# renderingarna på planerna, med bilderna ur releasen bilder. Bara de snabba stegen körs här (./bygg --snabb); de tunga beräkningarna räknas lokalt och deras resultat
# checkas in (se verktyg/bygg/README.md). En tagg rev-* (t.ex. rev-B) på main publicerar dessutom handlingarna som en
# release.
name: Bygg

on:
  push:
    branches: [main]
    tags: ["rev-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bygg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Systempaket (typsnittet Carlito, OpenGL för OCP och VTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito libgl1 libegl1 libglu1-mesa libxrender1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/requirements.txt"

      - name: Modellens cache
        uses: actions/cache@v4
        with:
          path: verktyg/modellering/.cache
          key: modell-${{ hashFiles('modeller/trebodar/**', 'verktyg/modellering/**') }}
          restore-keys: modell-

      # bilderna renderas lokalt och publiceras i releasen bilder (./mod publicera, renderingar/README.md); de hämtas
      # före bygget, som skriver startsidan med dem. Förteckningen och filerna den listar hämtas med releasens
      # nedladdningsadresser, inte API:t (en fil per anrop tog slut på API:ts timgräns); saknas en fil stannar bygget
      - name: Renderingarna
        run: |
          bas="https://github.com/$GITHUB_REPOSITORY/releases/download/bilder"
          mapp=docs/renderingar/bilder
          mkdir -p "$mapp"
          if ! curl -fsSL --retry 3 -o "$mapp/renderingar.json" "$bas/renderingar.json"; then
            echo "inga renderingar publicerade"
            exit 0
          fi
          python3 -c 'import json, sys
          for v in json.load(open(sys.argv[1])).values():
              for f in v["filer"] + [g for s in v.get("serier", {}).values() for g in s["filer"]]:
                  print(f)' "$mapp/renderingar.json" \
            | xargs -P 16 -I{} curl -fsSL --retry 3 -o "$mapp/{}" "$bas/{}"
          echo "$(ls "$mapp" | wc -l) filer"

      - name: Bygg
        run: ./bygg --snabb --jobb 4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Handlingarna till releasen
        if: startsWith(github.ref, 'refs/tags/rev-')
        uses: actions/upload-artifact@v4
        with:
          name: handlingar
          path: |
            rapporter/*.pdf
            ritningar/*.pdf

  publicera:
    if: github.ref == 'refs/heads/main'
    needs: bygg
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/rev-')
    needs: bygg
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: handlingar
      - name: Release med handlingarna
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Handlingarna byggda ur $GITHUB_SHA." rapporter/*.pdf ritningar/*.pdf
