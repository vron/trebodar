# ------------------------------------------------------------------
# Indata – U-05 Värmeförluster och energibehov
# Ändra värden här och kör:  python berakning.py
# Längder i mm (om inget annat anges), λ i W/(m·K), R i m²K/W, U i W/(m²K), ψ i W/(m·K), temperaturer i °C.
# Mängderna (areor, virkesandelar, öppningar) är mätta i modellen och kontrolleras mot den med
# verktyg/modellanalys/kontroll_u05.py.
# ------------------------------------------------------------------

[projekt]
namn        = "Fritidshus Trebodar, Resö, Tanum"
objekt      = "Värmeförluster och energibehov"
dokument    = "U-05"
revision    = "A"
datum       = "2026-11-13"
upprattad   = "Viktor Ogeman"
granskad    = ""
underlag    = "Modellen (modeller/trebodar), F-01 rev A, K-05 (källarväggarna), K-06 rev A (bottenplattan), K-01 (nock- och dalbalkarna), VL-01, U-03 (klimatfilen), BBR 29, BEN"

# ------------------------------------------------------------------ material
# λ: deklarerade eller tabellerade värden (SS-EN ISO 10456 där inget annat anges). rc: värmekapacitet [MJ/(m³K)].
[material]
gips       = { lam = 0.25,  rc = 0.75, anm = "gipsskiva, ISO 10456" }
osb        = { lam = 0.13,  rc = 1.0,  anm = "OSB/3, ISO 10456" }
plywood    = { lam = 0.13,  rc = 0.8,  anm = "plywood, ISO 10456" }
tra        = { lam = 0.13,  rc = 0.8,  anm = "konstruktionsvirke C24 tvärs fibrerna, ISO 10456" }
limtra     = { lam = 0.13,  rc = 0.8,  anm = "limträ, ISO 10456" }
mineralull = { lam = 0.037, rc = 0.03, anm = "mineralullsskiva i väggarna; produkten inte vald, vanlig 37-skiva" }
trafiber   = { lam = 0.038, rc = 0.1,  anm = "Hunton Nativo träfiberlösull, deklarerat (K-02)" }
hardboard  = { lam = 0.18,  rc = 1.3,  anm = "hård träfiberskiva 3 mm (K-02)" }
utegips    = { lam = 0.25,  rc = 0.75, anm = "utegips 10 mm" }
eps        = { lam = 0.036, rc = 0.03, anm = "cellplast EPS S100/S300 och Sundolitt Kub ovan mark och inomhus" }
eps_mark   = { lam = 0.038, rc = 0.03, anm = "cellplast mot mark och under plattor (något fuktig)" }
betong     = { lam = 1.7,   rc = 2.1,  anm = "armerad betong 2 300 kg/m³, ISO 10456 (U-01)" }
stal       = { lam = 50.0,  rc = 3.6,  anm = "konstruktionsstål" }
sten       = { lam = 2.8,   rc = 2.2,  anm = "fasadsten, granit, med fogbruk" }
makadam    = { lam = 0.7,   rc = 1.5,  anm = "dränerad makadam (U-01)" }
fyllning   = { lam = 2.0,   rc = 2.0,  anm = "fyllning, sand och grus, ISO 13370 tabell 7 (U-01)" }
berg       = { lam = 3.5,   rc = 2.2,  anm = "granit (berg), ISO 13370 tabell 7" }

# Luftskikt (ISO 6946 tabell 8, ytor med ε = 0,9): R för slutna, oventilerade skikt [m²K/W]
[luftskikt]
d          = [0, 5, 7, 10, 15, 25, 50, 100, 300]
R_vagrat   = [0.0, 0.11, 0.13, 0.15, 0.17, 0.18, 0.18, 0.18, 0.18]   # värmeflöde vågrätt
R_uppat    = [0.0, 0.11, 0.13, 0.15, 0.16, 0.16, 0.16, 0.16, 0.16]   # uppåt

# Ytmotstånd (ISO 6946 tabell 7) och golvvärmens yta (SS-EN 1264: 10,8 W/m²K med strålning)
[ytmotstand]
Rsi_vagrat = 0.13
Rsi_uppat  = 0.10
Rsi_nedat  = 0.17
Rse        = 0.04
R_golvvarme = 0.0926      # 1 / 10,8, golvvärmens yta mot rummet (SS-EN 1264-2)
# Ventilerad luftspalt bakom fasaden och i taket: skikten utanför spalten räknas inte, och spalten får samma
# ytmotstånd som insidan (ISO 6946 6.9.4).
Rse_ventilerad_vagg = 0.13
Rse_ventilerad_tak  = 0.10

# ------------------------------------------------------------------ uppbyggnader
# Skikten inifrån och ut [mm]. Installationsskiktet är liggande läkt 45×45 c/c 600 innanför ångbromsen, med mineralull
# mellan läkten (modellen, beställaren). Regelstommen: reglar 45 c/c 600; virkesandelen per vägg mäts i modellen
# (se [[vagg]]).
[vaggtyp.v95]
namn       = "Yttervägg 45×95 med installationsskikt"
skikt      = [["gips", 13], ["osb", 12], ["installation", 45], ["stomme", 95], ["utegips", 10]]
[vaggtyp.v145]
namn       = "Gavel 45×145 med installationsskikt (2SV)"
skikt      = [["gips", 13], ["osb", 12], ["installation", 45], ["stomme", 145], ["utegips", 10]]
[vaggtyp.v145u]
namn       = "Gavel 45×145 utan installationsskikt (1SV)"
skikt      = [["gips", 13], ["osb", 12], ["stomme", 145], ["utegips", 10]]
[installation]
isolerad   = true         # mineralull mellan läkten i ytterväggarnas installationsskikt (modellen)
lakt_b     = 45
lakt_cc    = 600
[stomme]
regel_b    = 45
regel_cc   = 600

# Taket mellan takbalkarna (F-01, U-03): gips 2 × 12,5, installationsskikt 45 (läkt 45×45 c/c 400, utan isolering:
# U-03 anger att installationsskiktet under takets fuktadaptiva ångbroms inte isoleras), ångbroms, takbalkar 45×170
# c/c 600 med träfiber 170, hård träfiberskiva 3 och luftspalten (ventilerad, U-03).
[tak]
skikt      = [["gips", 25], ["installation", 45], ["stomme", 170], ["hardboard", 3]]
balk_b     = 45
balk_cc    = 600
lakt_cc    = 400          # installationsskiktets läkt i innertaket (modellen)
installation_isolerad = false   # mineralull mellan läkten i innertaket (modellen och U-03: nej)
lutning    = 30

# Gavelspetsarna ovanför hammarbandet (z > 2 490): gavelstolarna med gips, OSB, ångbroms, installationsskikt (utom
# 1SV), stolens fack, utegips och panel. Facken är lika djupa som väggens regelstomme (95, i 1SV och 2SV 145) och
# isolerade med mineralull som väggen under (modellen).
[gavelspets]
isolerad   = true         # mineralull i gavelstolarnas fack (modellen)
virkesandel = 0.12        # ståndare, underram och diagonaler i gavelns plan

# Källarväggarna: Sundolitt Kub 350-150 (K-06), gips 12,5 invändigt
[kallarvagg]
skikt      = [["gips", 12.5], ["eps", 100], ["betong", 150], ["eps_mark", 100]]

# Bottenplattan L400 (K-06, R-04): betong 100 på cellplast 300; kantbalk 450 × 300 på cellplast 100 (L-elementets fot)
[bottenplatta]
betong     = 100
eps        = 300
kantbalk_b = 450
kantbalk_h = 300
fot_eps    = 100
rygg_eps   = 100
makadam    = 150

# Mellanbjälklaget (K-05): betong 150, kantisolering 30 (cellplast), golvvärmen PE-RT 16 × 2 c/c 300 (badrummet 200)
# med centrum 68 mm under överkant (modellen: I_BETONGEN), slingorna 150 mm från väggarna.
[bjalklag]
h          = 150
kant_eps   = 30
ror_z      = 68
ror_d      = 16
ror_cc     = 300
marginal   = 150

# Plattan på mark (AR-02): mellanbjälklaget på cellplast 100 + 250, L-element 500 med rygg 100 och fot 100, makadam 150
[platta_pa_mark]
eps        = 350
rygg       = 100
fot        = 100
makadam    = 150
kontur     = [[0, 9205], [4545, 9205], [4545, 11010], [4310, 11010], [4310, 15900], [0, 15900]]

# Nock- och dalbalkarna (K-01): limträ 190 × 180 med stålplåt 10 i över- och underkant (där plåtarna finns),
# upplagsreglar 45 på båda sidor.
[balkar]
b          = 190
h          = 200
plat_t     = 10
upplag_b   = 45
nockar     = [{ namn = "NB1", x = 11655, y = [970, 12540], plat = 6038 },
              { namn = "NB3", x = 6905,  y = [-30, 11040], plat = 5235 },
              { namn = "NB5", x = 2155,  y = [3560, 15930], plat = 9970 }]
dalar      = [{ namn = "DB2", x = 9405, y = [970, 11040], plat = 3733 },
              { namn = "DB4", x = 4405, y = [3560, 11040], plat = 5540 }]

