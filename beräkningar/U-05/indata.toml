# ------------------------------------------------------------------ drift och brukare
# BEN (BFS 2016:12 med ändringar t.o.m. BFS 2017:6) tabell 2:1, nya småhus: 21 °C, hushållsel 30 kWh/m² Atemp och
# år varav 70 % tillgodo, personvärme 80 W i 14 h/d enligt tabell 2:3 (5 rum och kök: 3,51 personer), tappvarmvatten
# 20 kWh/m² Atemp och år, vädring 4 kWh/m² (allmänt råd), solavskärmning 0,71.
[drift]
T_inne     = 20.0         # lägst 20 °C inne (beställaren); BEN:s 21 °C räknas som ett fall för BBR:s primärenergital
T_vadring  = 24.0         # vädring (mer uteluft) när rummet blir varmare
hushallsel = 30.0
hushallsel_internlast = 0.70
personer   = 3.51
person_W   = 80.0
person_h   = 14.0
tappvarmvatten = 20.0
vadring    = 4.0
solavskarmning = 0.71
# Närvaron (beställaren): huset används helgerna, fredag 18 till söndag 18 (svensk normaltid). Då gäller BEN:s
# internlast och grundflödena; resten av veckan står huset tomt, med frånluften nere (se [ventilation]) och bara
# grundlasten som internlast. Tappvarmvattnet och vädringen räknas efter andelen av tiden som någon är hemma.
# "alltid": helårsboende enligt BEN (så räknas BBR:s primärenergital). Inne hålls minst T_inne hela tiden.
narvaro    = "helg"
helg       = [[4, 18], [6, 18]]     # från och till: veckodag (måndag 0) och timme
grundlast_W = 50.0        # när huset står tomt: kyl, frys och standby (uppskattat), allt blir värme

# Ventilationen (VL-01): frånluft utan värmeåtervinning, uteluften genom ventilerna i fönstren. Grundflöden; köksfläkten
# forceras 30 min/dygn (BEN) till 111 l/s när någon är hemma. BBR 6:251: minst 0,35 l/s·m² golvarea när någon vistas i
# bostaden; när ingen gör det får flödet gå ned till 0,10 l/s·m². När huset står tomt (se drift.narvaro) går alla
# fläktarna ned i samma proportion till tomt_flode.
[ventilation]
FF1        = 56.0         # köket, normalt
FF1_forcerad = 111.0
forcering_min = 30.0
FF2        = 10.0         # badrummet
FF3        = 10.0         # källarrummet
flaktel_W  = 60.0         # fläktarnas el, grundflöde (uppskattat)
tomt_flode = 0.10         # frånluften när huset står tomt [l/s·m² Atemp]
tomt_sank  = true         # sänk frånluften när huset står tomt (fallet utan: grundflödena hela tiden)

# Lufttäthet och infiltration: q50 är antaget (ingen provtryckning ännu). Infiltrationen räknas med LBL-modellen
# (ASHRAE Fundamentals kap. 16) ur q50 och läggs ihop med frånluften kvadratiskt (Q = √(Q_frånluft² + Q_inf²)).
[infiltration]
q50        = 0.6          # l/s per m² omslutande area vid 50 Pa
n          = 0.65
Cs         = 0.000290     # stigkraft, två våningar [(l/s)²/(cm⁴K)] -> se dynamik.py
Cw         = 0.000420     # vind, två våningar, skärmningsklass 1 (öppet kustläge)

# Trapphålet mellan plan 1 och källaren (K-05): öppet, luften blandas mellan våningarna (dubbelriktat flöde)
[trapphal]
b          = 2070
l          = 828
Cd         = 0.6
reduktion  = 0.5          # trappan och räcket i öppningen

# Värmepumpen (IN-01): bergvärmepump NIBE S1256-13 (eller CTC GSi 612) med borrhål ca 200 m. Värmefaktorn räknas
# varje timme ur kondensorns och förångarens temperaturer: COP = η · T_kond / (T_kond − T_förång) [K], med η
# bestämt så att COP blir NIBE:s 5,06 vid B0/W35 (SS-EN 14511, 5,12 kW). Kondensorn: golvvärmens framledning, som
# är golvvärmeplanets temperatur plus rörens motstånd mot betongen (PE-RT 16 × 2 c/c 300) och halva temperaturfallet,
# plus 2 K. Förångaren: köldbärarens medeltemperatur i borrhålet minus halva temperaturfallet och 2 K. Köldbäraren:
# ostörd berggrund minus borrhålets motstånd gånger uttaget per meter och bergets motstånd gånger uttaget i tre
# tidsskalor (6 timmar, 30 dygn och medeluttaget under driftåren; linjekällan, bergets λ och värmekapacitet ur
# [material]).
[varmepump]
COP_B0W35  = 5.06         # NIBE S1256-13, SS-EN 14511, B0/W35
lyft_min   = 28.0         # minsta temperaturlyft mellan förångning och kondensering som räknas [K] (antaget:
                          # kompressorns minsta tryckförhållande; ger värmefaktorn högst ca 7,4)
approach   = 2.0          # kondensor och förångare mot vattnet och köldbäraren [K]
dT_vatten  = 5.0          # golvvärmens temperaturfall [K]
dT_koldbarare = 3.0       # köldbärarens temperaturfall [K]
R_ror      = 0.089        # rören mot golvvärmeplanet [m²K/W]: (c/(2πλ_b)) ln(c/(π d_y)) + c ln(d_y/d_i)/(2πλ_PE)
T_berg     = 8.5          # ostörd berggrund, medel över borrhålet [°C] (typvärde för kusten i Bohuslän)
borrhal_L  = 200.0        # [m] (IN-01: 1 borrhål, ca 200 m)
R_borrhal  = 0.08         # borrhålets motstånd, enkel U-slinga i grundvattenfyllt hål [m·K/W]
borrhal_d  = 115          # borrhålets diameter [mm]
driftar    = 10           # år av drift som bergets långsamma avkylning räknas för
COP_tvv    = 3.0          # tappvarmvatten, tappprofil XL (SS-EN 16147), typvärde för bergvärmepumpar
pumpel_W   = 60.0         # köldbärar- och golvvärmepumparna när värmepumpen går (uppskattat)

# Elpriset, de rörliga delarna [öre/kWh med moms], för kostnaden i kronor. Spotpriset är månadsmedel i elområde SE3
# för åren i ar (Nord Pool, dagen före-marknaden; boio.se/el/elpris-historik, hämtat 2026-11-13), januari–december.
# De fasta avgifterna (elnätets och elhandelns abonnemang) ingår inte: de betalas oavsett.
[elpris]
ar         = [2023, 2024, 2025]
spot       = [[115.7, 103.3, 100.9, 86.1, 49.0, 66.3, 47.1, 46.2, 30.4, 41.3, 102.7, 99.0],
              [100.3, 63.0, 74.4, 70.4, 29.6, 34.1, 25.9, 10.7, 20.6, 28.7, 83.6, 72.8],
              [79.3, 96.3, 63.6, 46.9, 53.7, 28.5, 46.3, 60.7, 65.4, 78.5, 87.1, 64.6]]
paslag     = 7.0          # elhandlarens påslag och elcertifikat (antaget)
energiskatt = 45.0        # 2026: 36,0 öre/kWh utan moms (Skatteverket)
elnat      = 26.0         # överföringsavgift, Ellevio säkringsabonnemang 16–63 A från 2026-06-01 (Tanum hör till
                          # Ellevios kommuner; nätägaren på Resö är inte kontrollerad)

# BBR 29 (BFS 2020:4) avsnitt 9:2: småhus > 130 m² Atemp, Tanum
[bbr]
EP_krav    = 90
Um_krav    = 0.30
VF_el      = 1.8
Fgeo       = 0.9
effekt_bas = 4.5

# Skarvar som inte räknas i 2D (uppskattade, typvärden med invändiga mått)
[uppskattade_skarvar]
kallarfonster = 0.05      # källarens fönster och dörr i Kub-väggen [W/(m·K)]
gavelkant = 0.05          # gavelns takkant (takets isolering mot gavelstolen) [W/(m·K)]

# Timsimuleringen
[dynamik]
rumshojd_plan1 = 3.0          # medelhöjd under det lutande innertaket [m]
lattvikt_kJ_m2K = 40.0        # plan 1: gips, OSB, innerväggar och möbler per m² golv
lattvikt_kallare_kJ_m2K = 20.0
skuggning = 0.9               # takfot, smyg och omgivning (utöver BEN:s solavskärmning)
sol_till_golv = 0.5           # andel av solen genom fönstren som träffar golvet (bjälklaget)
P_max = 13.0                  # värmepumpens största värmeeffekt [kW]
styr_horisont_h = 12          # golvvärmens styrning: rummets temperatur så många timmar framåt

# ------------------------------------------------------------------ klimat
[klimat]
fil        = "../U-03/klimat_era5.csv.gz"   # ERA5 2013-07 – 2023-12, timvärden (U-03)
ar         = [2014, 2023]                   # hela år som räknas
markreflektion = 0.2
azimut_x   = 318.0                          # husets +x mot geografiska norr (AR-02, U-03)
lat        = 58.80
lon        = 11.25

# ------------------------------------------------------------------ nät
[nat]
h_2d       = 2.5          # cellstorlek i 2D-snitten nära skarvarna [mm]
h_3d       = 50           # cellstorlek i 3D-modellen vid väggarna och plattornas kanter [mm]
h_3d_max   = 3000

# ------------------------------------------------------------------ fall
