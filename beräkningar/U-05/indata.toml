# Fönstren: VELFAC 200 ENERGY (byggdelar/velfac.py), isolerruta 3-glas 4-18-4-18-4 med två lågemissionsskikt och
# argon, siktlinjen (karmens ytterkant till glaskanten) 54 mm. VELFAC anger Uw ned till 0,80 för referensfönstret
# 1 230 × 1 480 (SS-EN ISO 10077-1). Ug och ψg är antagna typvärden; Uf är bestämt så att referensfönstret får 0,80.
[velfac]
Ug         = 0.50
psi_g      = 0.040
Uw_ref     = 0.80
ref_b      = 1230
ref_h      = 1480
siktlinje  = 54
mittpost   = 108          # skjutdörrens möte och kopplingarna mellan partierna: två siktlinjer
g          = 0.50         # isolerrutans g-värde (3-glas med två lågemissionsskikt, typvärde)
# skjutdörren 2SV-D1: fyra partier (två skjutbara mellan två fasta), fönsterdörrarna och fönstren ett
partier    = { "skjutdörr" = 4, "pardörr" = 2 }

# Ytterdörrarna med panel (huvudentrén 1SO-D1 och källarens pardörr D1): produkten är inte vald (IN-01)
[ytterdorr]
U          = 1.0

# Takfönstren TF1–TF3: öppningen 1 200 × 1 200 i takets plan, produkten inte vald (IN-01). 3-glas, Uw i takets
# lutning, och anslutningen mot taket (isoleringskrage).
[takfonster]
b          = 1200
h          = 1200
Uw         = 1.10
psi        = 0.10
g          = 0.45
antal      = 3
takfall    = ["1SO", "1SO", "3SO"]

