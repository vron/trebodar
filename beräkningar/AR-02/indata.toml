# ------------------------------------------------------------------
# Indata – AR-02 Utsättning: koordinater och höjder
# Ändra värden här och kör:  python ritningar.py
# Plan: K-05:s koordinater (mm) från bild/geometri.json. Koordinater SWEREF 99 12 00 (m), höjder RH2000 (m).
# ------------------------------------------------------------------

[projekt]
dokument    = "AR-02"
revision    = "A"
datum       = "2026-10-31"
underlag    = "Bygglov BYGG.2025.2278 (situationsplan 200, sektion E 208), K-05, K-06"

# Fasadens hörn F1–F12 i SWEREF 99 12 00 (N, E i m): utsättningsdata 09_91, punkt 1–12, 2026-10-31. F1 är
# hörnet x = 13 905, y = 905 i K-05:s koordinater, sedan medurs. Husets läge (vridning θ och förflyttning E0, N0) passas
# in mot dem i ritningar.py:
#   E = E0 + (x cos θ − y sin θ) / 1000,   N = N0 + (x sin θ + y cos θ) / 1000
# Punkterna stämmer med fasadens mått inom 1 mm (restfel högst 0,6 mm).
[koordinater]
system      = "SWEREF 99 12 00"
hojdsystem  = "RH2000"
hornen      = [
    [6520175.041, 102362.162],
    [6520171.660, 102365.132],
    [6520172.320, 102365.883],
    [6520168.563, 102369.183],
    [6520166.194, 102366.485],
    [6520162.813, 102369.455],
    [6520154.564, 102360.062],
    [6520157.945, 102357.093],
    [6520161.172, 102360.767],
    [6520164.929, 102357.468],
    [6520163.939, 102356.341],
    [6520167.321, 102353.371],
]
restfel_max = 2.0       # största tillåtna avvikelse mellan punkterna och fasadens mått [mm]

# Fasadens utsida: väggarnas regel (plan 1, även gavlarna) och källarväggarnas ytterliv ligger 30 mm utanför
# mellanbjälklagets kant (K-05). Beklädnaden på plan 1 (utvändig gips 10, spikläkt 12, bärläkt 21, panel 22) och
# fasadstenen på källarväggarna (AR-01, kluven framsida högst 65 mm utanför cellplasten) går 65 mm längre ut.
# Situationsplanens yta ger 64 mm.
[fasad]
regel       = 30        # väggens ytterliv (regel, källarväggens cellplast) utanför plattans kant [mm]
beklad      = 65        # fasadens utsida utanför väggens ytterliv [mm]

# Höjder i RH2000. FG är färdigt golv på plan 1 enligt bygglovet = mellanplattans överkant (betonggolv).
[hojder]
fg          = 8.500     # färdigt golv plan 1 (bygglov) = mellanplattans överkant
h_bjalklag  = 0.150     # mellanbjälklaget (K-05)
h_kallare   = 2.100     # bottenplattans överkant till bjälklagets underkant (K-05, R-05)
h_platta    = 0.100     # bottenplattans betong i fält (R-04)
t_cellplast = 0.200     # cellplast under plattan, makadamens överkant (R-04)
t_makadam   = 0.150     # makadam, minst (U-01); berget sprängs och avjämnas under
h_l_mark    = 0.500     # plattan på mark: L-elementens höjd; deras underkant och cellplastens underkant på makadamen
mmn         = 7.68      # medelmarknivå (bygglov, sektion E)
byggnadshojd = 3.468    # MMN till skärningspunkt vägg/takplan, nordvästra fasaden (bygglov); ritar bara taket
dranering   = 5.814     # tillgänglig nivå för avledning av dränvattnet
ny_mark_nv  = 7.786     # ny marknivå vid nordvästra fasaden (bygglov, sektion E: 3 362 under skärningspunkten)
ny_mark_so  = 7.138     # ny marknivå vid sydöstra fasaden (bygglov, sektion E: 4 010 under skärningspunkten)
takvinkel   = 30        # grader (K-01); samma takfot (skärningspunkten) runt hela huset och i dalarna
y_snitt     = 6000      # sektion A–A, i K-05:s y [mm]

# Höjdreferens: byggfixen på nybyggnadskartan (Tanums kommun, 2025-11-12, utgåva A; dwg-filens block Byggfix):
# överkant gränsdubb i berg vid tomtens västra hörn, +7,76 (RH2000), läge i SWEREF 99 12 00 i cm. Den inmätta
# gränspunkten i samma hörn ligger 5–8 mm därifrån. Alla höjder på AR-02 anges i RH2000 och relativt dubben.
[fixpunkt]
namn        = "FIX"
beskrivning = "överkant gränsdubb i berg vid tomtens västra hörn"
hojd        = 7.76
N           = 6520149.77
E           = 102329.26
