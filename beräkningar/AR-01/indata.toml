# ------------------------------------------------------------------
# Indata – AR-01 Fasadsten på källarväggarna, infästning
# Ändra värden här och kör:  python berakning.py  och  python ritningar.py
# Längder i mm, laster i kN, spänningar i N/mm² (MPa).
# ------------------------------------------------------------------

[projekt]
dokument    = "AR-01"
revision    = "A"
datum       = "2026-10-10"
underlag    = "K-06, Sundolitt Kub TG 2216, modeller/trebodar.step"

# Källarväggen: Sundolitt Kub 350-150 (U17), SINTEF TG 2216. Betong B30 enligt Sundolitt, räknas som C30/37.
[vagg]
produkt     = "Sundolitt Kub 350-150 (U17)"
karna       = 150       # betongkärna
eps         = 100       # cellplast EPS 120 på var sida
gips        = 13        # invändig gips, TG 2216
fck         = 30.0

# Skikten utanför cellplastens yta, till stenens (sågade) baksida 15 mm. Stenen har kluven framsida, 30–50 mm.
[skikt]
armeringsbruk = 6       # 5–7 mm, nät i yttre tredjedelen
fastmassa     = 9       # 6–12 mm, tar upp stenens tjockleksavvikelse
sten          = 40      # medeltjocklek, för vikt och lastens läge
sten_min      = 30
sten_max      = 50

# Stenen: Stengrossen order 579 (faktura 1397, 2026-06-15). Beklädnadsgranit Bohus Grå 600–1200 × 400 × 30/50 mm,
# 28 m², och 9 hörnstenar 200–400 × 400 × 30/50 mm. Frakt 3 100 kg, cirka 105 kg/m²; räknas som 40 mm, 108 kg/m².
# Höjden på en stödvinkel: modellens beklädnad (Beklädnad stor/liten) är 0,8–2,0 m hög, i steg om 400 mm.
[sten]
produkt     = "Beklädnadsgranit Bohus Grå, Stengrossen"
densitet    = 2700      # kg/m³, granit
langd       = [600, 1200]
hojd        = 400       # skifthöjd
horn        = [200, 400]    # hörnstenarnas skänklar
fog         = 10        # minst 10 mm för natursten (DIBt Z-33.46-568)
H_max       = 2000      # största stenhöjd på en stödvinkel
fastmassa_densitet = 1600   # kg/m³, härdad cementbaserad fästmassa
skift_exempel = 4       # antal skift i fasadexemplet

# Stödvinkel L 50 × 50 × 5, EN 1.4404 (standardprofil): lodrätt liv nedåt mot armeringsbruket, vågrätt ben under
# nedersta skiftet. Vinkeln ligger under mark, så benet får sticka ut förbi stenens tunnaste delar.
[vinkel]
t           = 5
liv         = 50
fot         = 50        # från armeringsbrukets yta
L_max       = 3000
glipa       = 5
fy          = 220       # EN 1993-1-4 tabell 2.1, 1.4404 varmvalsad plåt
E           = 200000

# Gängstänger M16 A4-70 genom cellplasten (avståndsmontage) i injektionsmassa fischer FIS V (ETA-02/0024),
# sprucken betong, temperaturområde I. Mutter och bricka på båda sidor om vinkelns liv.
[stang]
d           = 16
As          = 157.0     # mm²
fuk         = 700
fyk         = 450
cc          = 300
kant_max    = 150       # största avstånd från vinkelns ände till närmaste stång
y           = -25       # stångens läge, 25 mm under stenens underkant (livets mitt)
hef         = 100
hal_d       = 18
tau_Rk_cr   = 6.0       # ETA-02/0024 tabell C5.1, M16, C20/25, sprucken betong, temperaturområde I
psi_c       = 1.10      # C30/37, tabell C4.1
psi0_sus    = 0.74      # varaktig last, tabell C4.1
k8          = 2.0       # bändbrott, tabell C4.1
gM          = 1.5       # γMp = γMc, γinst = 1,0

# Isolerplugg genom nätet i armeringsbruket.
[plugg]
produkt     = "EJOT ejotherm STR U 2G"
eta         = "ETA-04/0023"
L           = 155
tallrik     = 60
hef         = 25
NRk         = 1.5       # kN, betong C12/15–C50/60, tabell C1
gM          = 2.0       # bilaga B1
n_min       = 4         # st/m², DIBt Z-33.46-568 för natursten
cc_x        = 600       # i stenskiftens mitthöjd, förskjutna en halv delning mellan skiften
cc_y        = 400
s_min       = 100       # minsta avstånd till andra infästningar och betongkärnans kanter

# Vind på fasaden. Hastighetstrycket från F-01 (z = 7 m) på säker sida för källarväggens höjd.
[vind]
qp          = 1.09      # kN/m²
cpe         = 1.4       # sug, zon A, cpe,1 (små ytor)

[last]
gamma_d     = 0.91      # säkerhetsklass 2
gamma_G     = 1.35      # 6.10a, bara permanent last
gamma_Q     = 1.5
