# ------------------------------------------------------------------
# Indata – TP-01 Tidsplan och organisation
# Byggets faser och steg från rivningens start med tider, ansvarig och inblandade, och organisationen. Inköpslistan (IN-01) använder
# faserna: varje specialprodukt ska finnas på bygget när dess fas börjar.
# Ändra här och kör ./bygg TP-01 (då byggs även IN-01 om).
#
# [[part]]: kod, kort (i tabellerna), roll, namn (tomt: inte vald), status, uppgift. Inga telefonnummer eller adresser.
# [[fas]]: kod, namn. [[steg]]: fas, namn, start, slut (datum), ansvarig (en part, tomt: inte bestämt), forslag (true:
# ansvarig är ett förslag), inblandade, anm, milstolpe (true: en tidpunkt), klar, prel (true: preliminärt datum).
# ------------------------------------------------------------------

