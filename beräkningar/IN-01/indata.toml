# ------------------------------------------------------------------
# Indata – IN-01 Inköpslista
# Specialprodukterna: det som väljs, beställs eller tillverkas för sig (vitvaror, fönster, kamin, armaturer,
# specialtillverkat stål och limträ …), inte vanligt material (virke, skivor, isolering, armering, kabel, rör).
# Modellen märker produkten där den skapas (produkt="KOD" i geometriskriptet), så att antalet och instansernas id
# kommer ur modellen; här står resten. Ändra status här och kör ./bygg IN-01.
#
# [[produkt]]: kod (som i modellen), grupp, namn, status, ansvarig (en roll), fas (fasen i tidsplanen TP-01:
# produkten ska finnas på bygget när fasen börjar), vald (produkten eller utförandet, krävs när status inte är
# "att välja"), leverantor, dokument, arende (GitHub), anm. En produkt som inte är modellerad anger omfattning.
# ------------------------------------------------------------------

[projekt]
namn        = "Fritidshus Trebodar, Resö, Tanum"
objekt      = "Inköpslista"
dokument    = "IN-01"
revision    = "A"
datum       = "2026-11-05"
upprattad   = "Viktor Ogeman"
granskad    = ""

# status i ordning
[status]
"att välja" = "Produkten är inte vald; modellen anger mått och krav"
"vald"      = "Produkten eller utförandet är bestämt, inte beställt"
"offert"    = "Offert begärd eller mottagen"
"beställd"  = "Beställd"
"levererad" = "Levererad till bygget"
"monterad"  = "Monterad"

[roller]
byggherre = "Byggherren"
bygg      = "Byggentreprenören"
el        = "Elektrikern"
vvs       = "VVS-entreprenören"

