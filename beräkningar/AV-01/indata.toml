# Rivning: förekomst och mängder enligt materialinventeringen
[[rivning]]
avfall = "Farligt avfall"
forekomst = "Takpapp med tjära, ca 75 m². Tryckimpregnerat trä från altanen, ca 15 m², och eventuella tryckimpregnerade syllar"
plats = "Tas bort före stommen. Egen behållare, blandas inte med annat avfall"
behandling = "Anläggning med tillstånd för farligt avfall"
[[rivning]]
avfall = "Metall"
forekomst = "Hängrännor och stuprör, ca 20 m. Takstege och skorstenskupa"
plats = "Egen behållare"
behandling = "Materialåtervinning"
[[rivning]]
avfall = "Betongpannor"
forekomst = "Takpannor av betong, ca 75 m²"
plats = "Egen behållare"
behandling = "Deponi"
[[rivning]]
avfall = "Övrigt mineral"
forekomst = "Källargolv av betong, ca 2,5 m³. Lättbetong i källarväggar och grund, ca 40 m². Mursten från öppen spis, ca 5 ton, och skorstenens tegel"
plats = "Eget flak"
behandling = "Deponi"
[[rivning]]
avfall = "Trä med isolering"
forekomst = "Stomme, ytterpanel, bjälklag, golv, innerväggar och inredning av trä och spånskiva, ca 50 m³, med en mindre mängd isolering"
plats = "Rivs i större delar med isoleringen kvar och lastas direkt i täckt container"
behandling = "Sorteras hos mottagaren. Träet energiåtervinns och isoleringen deponeras"

