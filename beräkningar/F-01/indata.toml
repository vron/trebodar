kg = 18.0

[bjalklag]
tjocklek    = 150     # platsgjuten betong [mm]
tunghet     = 25.0    # armerad betong [kN/m³], SS-EN 1991-1-1 tabell A.1
golv        = 0.5     # golvuppbyggnad [kN/m²]: trägolv 20 mm ca 0,15, klinker i våtrum ca 0,5

[nyttig]
qk          = 2.0     # kategori A, bjälklag [kN/m²], EKS tabell C-1
Qk          = 2.0     # [kN]
vagg        = 0.7     # lätta mellanväggar [kN/m²], valt på säker sida mot 0,5 enligt SS-EN 1991-1-1 6.3.1.2(8)

[sno]
sk          = 1.5     # [kN/m²]
Ce          = 1.0
Ct          = 1.0
alfa        = 30      # takvinkel [°]

[vind]
vb          = 25      # [m/s]
z0          = 0.003   # terrängtyp 0 [m]
z0_II       = 0.05
z           = 5.6     # referenshöjd: nockens höjd över mark (modellen: nocken 4,05 m och taktäckningen 0,08 m över
                      # golvet, marken som lägst 1,47 m under golvet; kontroll_laster.py) [m]
kp          = 3.0     # spetsfaktorn, EKS 11 kap. 1.1.4 7 § (allmänt råd: byggnader utan dynamiska effekter)
rho         = 1.25    # [kg/m³]

[nedbojning]
tak         = 300     # w_fin ≤ L/300, SS-EN 1995-1-1 tabell 7.2
bjalklag    = 250     # ≤ L/250 kvasipermanent last, SS-EN 1992-1-1 7.4.1(4)

[klasser]
sakerhetsklass = 2
gamma_d     = 0.91
livslangd   = 50

