# ------------------------------------------------------------------
# Indata – K-03 Takbalkar, takstolar och stolpar
# Ändra värden här och kör:  python berakning.py
# Geometrin (takbalkar, takfönster, takstolar, stolpar och väggar) står i geometri.json, som är K-03:s egen
# källfil och kontrolleras mot modellen med verktyg/modellanalys/kontroll_k03.py. Stolparnas laster kommer från K-05
# (laster.py), som bygger på K-01:s stödreaktioner; beräkningen stoppar om K-05:s reaktioner inte är K-01:s.
# Enheter: mm, kN, MPa (N/mm²) om inget annat anges. x, y och z som i K-05 (z från bjälklagets överkant).
# ------------------------------------------------------------------

[projekt]
namn        = "Fritidshus Trebodar, Resö, Tanum"
objekt      = "Takbalkar, takstolar och stolpar"
dokument    = "K-03"
revision    = "A"
datum       = "2026-10-09"
upprattad   = "Viktor Ogeman"
granskad    = ""

# ------------------------------------------------------------------ material (karakteristiska värden)
[material.C24]          # SS-EN 338
fmk = 24.0
ft0k = 14.5
fc0k = 21.0
fc90k = 2.5
fvk = 4.0
E0mean = 11000.0
E005 = 7400.0
rhok = 350.0
gamma_M = 1.3
beta_c = 0.2
[material.GL30h]        # SS-EN 14080
fmk = 30.0
ft0k = 24.0
fc0k = 30.0
fc90k = 2.5
fvk = 3.5
E0mean = 13600.0
E005 = 11300.0
rhok = 430.0
gamma_M = 1.25
beta_c = 0.1

[klass]
gamma_d     = 0.91      # säkerhetsklass 2
k_mod       = 0.8       # klimatklass 1, medellång last (snö)
k_mod_vind  = 0.9       # korttidslast (vindlyft)
k_def       = 0.6
k_cr        = 0.67      # sprickor, skjuvning
psi2_sno    = 0.1
nedbojning  = 300       # w_fin ≤ L/300 (F-01)

# ------------------------------------------------------------------ laster (F-01)
[last]
g_tak       = 0.60      # takets egenvikt per m² takyta [kN/m²] (F-01: 60,8 kg/m²)
takvinkel   = 30.0
s_k         = 1.5
mu_dal      = 1.6       # takfall mot en dal: μ2 = 1,6 jämnt över hela takfallet (standarden: från 0 vid nocken)
mu_takfot   = 1.0       # takfall mot takfot: 1,0 (standarden: μ1 = 0,8)
utsprang    = 0.2       # takutsprång vid takfot och gavel, horisontellt [m]
q_p         = 1.09      # hastighetstryck [kN/m²] som K-01 (referenshöjd 7 m; F-01 ger 0,97 vid 5,6 m)
cpe_cpi_G   = -1.6      # vindsug netto i zon G närmast gaveln (K-01): cpe −1,4, cpi +0,2

# ------------------------------------------------------------------ takbalkar
[takbalk]
b = 45
h = 170
cc = 600
material = "C24"
# Upplag mot nock- och dalbalkarna: upplagsregel på balkens sida, takbalken med hak över regeln.
[upplag]
regel_b = 45            # upplagsregelns bredd (vågrätt, under takbalken)
regel_h = 45            # regelns höjd = hakets höjd i lodled ovanför balkens underplåt
plat = 10               # balkens underplåt; regeln sitter på limträet ovanför plåten
balk_h = 200            # nock- och dalbalkens höjd (K-01)
balk_b = 190            # nock- och dalbalkens bredd (K-01)
skruv_d = 6.0           # skruv genom regeln in i limträet
skruv_L = 100
skruv_My = 9500.0       # flytmoment [Nmm], minst enligt ETA
skruv_fax = 11.0        # utdragshållfasthet f_ax,k [MPa] enligt ETA
rho_balk = 390.0        # limträets densitet (GL30c, K-01)
lyft_skruv_L = 160      # förankringsskruv snett genom takbalken in i balken
lyft_skruv_lef = 80     # gängans längd i balken

# Takbalkstyper i modellen (namnets början). Spann och utkragning räknas ur modellen: horisontellt mellan balkarnas
# centrumlinjer, vid takfot till ytterväggens centrum (17,5 mm innanför plattans kant, K-05).
[[typ]]
namn  = "ÅII"
text  = "Mittre huskroppen, nock–dal"
mu    = "dal"
[[typ]]
namn  = "ÅIY"
text  = "Mittre huskroppen, nock–takfot"
mu    = "takfot"
[[typ]]
namn  = "ÅYI"
text  = "Sidokropparna, nock–dal"
mu    = "dal"
[[typ]]
namn  = "ÅYY"
text  = "Sidokropparna, nock–takfot"
mu    = "takfot"

# Takfönster: avväxlingsregel (45×170) mellan dubbla takbalkar, kortlingar c/c 600 ovanför och nedanför.
[fonster]
bredd = 1200
rasspont_t = 20         # råspont [mm]
rasspont_E = 11000.0

# ------------------------------------------------------------------ takstolar
# Toppens last: K-01:s stödreaktion (via K-05) för nockbalkens stöd. Diagonalerna stagas av takets "extra"
# (takbalken ovanför innertaket) som fästs i diagonalen c/c 600.
[[takstol]]
namn  = "Stol 1NO"
text  = "Vänster, nedre gavel"
stod  = ["N5", "A"]
gavel = true
[[takstol]]
namn  = "Stol 1SV"
text  = "Vänster, övre gavel"
stod  = ["N5", "E"]
gavel = true
[[takstol]]
namn  = "Stol 2NO"
text  = "Mitten, nedre gavel"
stod  = ["N3", "A"]
gavel = true
[[takstol]]
namn  = "Stol L2M"
text  = "Mitten, mittakstol"
stod  = ["N3", "C"]
gavel = false
[[takstol]]
namn  = "Stol 2SV"
text  = "Mitten, övre gavel"
stod  = ["N3", "D"]
gavel = true
[[takstol]]
namn  = "Stol 3NO"
text  = "Höger, nedre gavel"
stod  = ["N1", "A"]
gavel = true
[[takstol]]
namn  = "3SV"
text  = "Höger, övre gavel"
stod  = ["N1", "E"]
gavel = true

# Toppkloss: en kloss 45 mm (diagonalens höjd, minst 600 mm lång) skruvas på var sida om toppen, så att balken vilar
# på 135 mm. alla = true: på alla takstolar (en detalj), annars bara där 45 mm inte räcker.
[toppkloss]              # toppklossarna i modellen (en per takstol), fibrerna vågräta
t = 45
kc90 = 1.5               # tryck vinkelrätt fibrerna under balken (6.1.5)
skruv_d = 6.0
skruv_L = 90
skruv_My = 9500.0

[spikplat]
t = 2.0                 # plåttjocklek [mm], S250GD+Z
fu = 330.0
bredd = 100
hal = 5.0
hal_per_rad = 4
spik_d = 4.0            # ankarspik 4,0×40
spik_L = 40
spik_fu = 600.0
gamma_M2 = 1.25
gamma_M_forband = 1.3

# ------------------------------------------------------------------ stolpar
# namn: K-05:s punktlast. sok: punkt i modellen där stolpen söks (kontroll_k03.py). gamla: beteckning i den äldre
# beräkningen. mat: material om inte C24. krav: utförande som ersätter modellens, när modellen saknar stolpe eller den
# inte räcker. L: knäcklängd om den inte ska tas ur modellen. e: lastens excentricitet [mm] i x-led.
[[stolpe]]
namn = "LN1_1"
sok = [11655, 2795]
[[stolpe]]
namn = "LN1_2"
sok = [11655, 4686]
gamla = "D"
[[stolpe]]
namn = "LN1_3"
sok = [11665, 6602]
gamla = "F"
huvud = true
[[stolpe]]
namn = "LD2_1"
sok = [9405, 4048]
[[stolpe]]
namn = "LD2_2"
sok = [9290, 5947]
gamla = "C"
[[stolpe]]
namn = "LD2_3"
sok = [9405, 7295]
gamla = "C"
[[stolpe]]
namn = "LD2_4"
sok = [9435, 10992]
gamla = "G"
[[stolpe]]
namn = "LN3_1"
sok = [7007, 2200]
gamla = "H"
e = 48.5        # nockbalk 3 vilar på 83 av stolpens 180 mm (väggen slutar före balkens mittlinje, #45)
[[stolpe]]
namn = "LD4_1"
sok = [4475, 5843]
gamla = "B"
e = 70
mat = "GL30h"
[[stolpe]]
namn = "LD4_2"
sok = [4420, 10992]
gamla = "G"
[[stolpe]]
namn = "LN5_1"
sok = [2095, 7160]      # hörnet 1A–1B: två reglar i 1B och 1A:s ändregel (stagad åt båda håll av väggarna)
[[stolpe]]
namn = "LN5_3"
sok = [2095, 9280]      # 1B:s ände mot den lätta väggen L20: två reglar i 1B
[[stolpe]]
namn = "LN5_2"
sok = [2030, 11000]
gamla = "D"
e = 71          # nockbalk 5 vilar på stolpens östra 83 av 225 mm (#45): lastens mitt x 2 101,5, stolpens 2 030,5

# Huvudstolpen (LN1_3): stolpe med dubbeltriangel under nockbalk 1, stöd D, strävor på båda sidor om stolpen.
# Krafterna (N_d, M_d, strävornas lodräta kraft) och strävans fäste i balken läses ur K-01:s resultat (resultat.json:
# balkmodellen, där stolpens böjstyvhet ingår), så att de följer K-01.
[huvudstolpe]
L = 2900                # golv till strävornas fäste (K-01)
strava_b = 45
strava_h = 120
strava_lager = 4
strava_L = 990          # strävans längd mellan knutpunkterna (modellen, 45°)

[huvudstolpe_fot]       # förankringen mot lyft vid foten: 2 vinkelbeslag ABR10525 på syllbitarna, betongbult genom var
beslag = "ABR10525"     # Simpson Strong-Tie, ETA-06/0106
R1_k = 25.5             # kN, 2 beslag, søjle på bjælke, fullt utskruvat med CSA5,0×40 (databladet)
R1_k_spik = 9.4         # kN, samma med beslagsöm CNA4,0×40 (räcker inte)
gamma_M = 1.35          # förband (databladets exempel)
n_beslag = 2
skruv = "6 + 8 st CSA5,0×40 per beslag"
bult_d = 12             # betongbult genom beslaget och syllen (samma som syllarnas, IN-01 BETONGBULT-SYLL)
bult_djup = 90
bandning = 1.5          # bultens drag av beslagets bändning kring bulten (hävarm skänkelns kant)
